name: Zephyr

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - nucleo-f767zi-mock
          - nucleo-f767zi-robotdyn
          - profile-native-test

    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          path: app

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi

      - name: Build ${{ matrix.target }}
        run: |
          case "${{ matrix.target }}" in
            nucleo-f767zi-mock)
              west build -p always -b nucleo_f767zi \
                -s app \
                -d build/nucleo-f767zi-mock
              ;;
            nucleo-f767zi-robotdyn)
              west build -p always -b nucleo_f767zi \
                -s app \
                -d build/nucleo-f767zi-robotdyn \
                -- -DEXTRA_CONF_FILE=app/ci/robotdyn.conf \
                   -DEXTRA_DTC_OVERLAY_FILE=app/ci/robotdyn.overlay
              ;;
            profile-native-test)
              west build -p always -b native_sim/native/64 \
                -s app/tests/profile \
                -d build/profile-native-test
              ;;
          esac

      - name: Run profile-native-test
        if: matrix.target == 'profile-native-test'
        run: build/profile-native-test/zephyr/zephyr.exe
